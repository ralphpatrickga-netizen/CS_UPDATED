{% extends "base.html" %}
{% block title %}Reset Password — BarangayConnect{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark">BC</span>
      <div><strong style="font-family:var(--font-display); color:var(--navy)">BarangayConnect</strong></div>
    </div>
    <h1>Reset your password</h1>
    <p class="auth-sub">Enter your registered resident email. If an account matches, we will email a time-limited reset code.</p>
    <form method="POST" class="form-grid">
      <div class="form-row">
        <label>Email address</label>
        <input type="email" name="email" value="{{ email or '' }}" required autofocus>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Reset Code</button>
    </form>
    <div class="auth-foot"><a href="{{ url_for('login') }}">Back to login</a></div>
  </div>
</div>
{% endblock %}
